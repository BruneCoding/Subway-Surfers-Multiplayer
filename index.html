<script>
/* Navigation guard: Poki's obfuscated bundles may contain a domain-lock that
   redirects the page to poki.com/sitelock via a plain location assignment.
   Block any top-level navigation to Poki lockdown URLs before it can happen.
   Anchor clicks / social share links are unaffected (they do not use the
   Location API). */
(function () {
  var LOCKDOWN = /(^|\.)poki\.com\/(sitelock|game-not-available)/i;
  function guard(locObj, label) {
    if (!locObj) return;
    try {
      var d = Object.getOwnPropertyDescriptor(Location.prototype, 'href');
      if (d && d.set) Object.defineProperty(Location.prototype, 'href', {
        get: d.get,
        set: function (v) { if (LOCKDOWN.test(String(v))) { console.warn('[guard] blocked ' + label + '.href -> ' + v); return; } d.set.call(this, v); },
        configurable: true
      });
      var oa = Location.prototype.assign, orp = Location.prototype.replace;
      Location.prototype.assign = function (v) { if (LOCKDOWN.test(String(v))) { console.warn('[guard] blocked ' + label + '.assign(' + v + ')'); return; } return oa.call(this, v); };
      Location.prototype.replace = function (v) { if (LOCKDOWN.test(String(v))) { console.warn('[guard] blocked ' + label + '.replace(' + v + ')'); return; } return orp.call(this, v); };
    } catch (e) {}
  }
  guard(window.location, 'self');
  try { guard(window.top === window ? null : window.top.location, 'top'); } catch (e) {}
})();
</script>

  var bad=/poki(-gdn)?\.com\/.*(poki-sdk|sitelock)|poki-sdk.*\.js|sitelock/i;
  var d=Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype,"src");
  if(d&&d.set)Object.defineProperty(HTMLScriptElement.prototype,"src",{get:d.get,set:function(v){if(bad.test(String(v))){return;}d.set.call(this,v);},configurable:true});
  var sa=Element.prototype.setAttribute;

  // never allow a sitelock-style redirect to poki.com (defence in depth on top of the stubbed SDK)

    window.fetch=function(u){try{if(bad.test(String(u)))return Promise.resolve(new Response('',{status:200}));}catch(e){}return _fh.apply(window,arguments);};
  }catch(e){}
})();

function LoadingBar()
{
    // Poki14: this object is the game's REAL progress source. It no longer draws
    // anything itself - every update is forwarded to the minimal loading screen
    // (mp-loader.js) which renders the logo + thin bar.
    var total = 0;
    var preInitActive = true;
    var preInitStartedAt = performance.now();
    var preInitFrame = 0;

    function fwd(ratio, loadedRatio)
    {
        window.__MPL_LAST = { ratio: ratio, loadedRatio: loadedRatio, total: total };
        if (window.MPLoader && window.MPLoader.set) window.MPLoader.set(ratio, loadedRatio, total);
    }

    function show()
    {
        if (preInitActive)
        {
            preInitStartedAt = performance.now();
            preInitFrame = requestAnimationFrame(updatePreInitProgress);
        }
        fwd(0);
    }

    function hide()
    {
        cancelAnimationFrame(preInitFrame);
        preInitActive = false;
    }

    function setTotal(mbs)
    {
        total = mbs;
    }

    function renderProgress(ratio, loadedRatio)
    {
        if (ratio < 0) ratio = 0;
        if (ratio > 1) ratio = 1;
        if (loadedRatio === undefined) loadedRatio = ratio;
        fwd(ratio, loadedRatio);
    }

    function updatePreInitProgress(now)
    {
        if (preInitActive)
        {
            var elapsed = now - preInitStartedAt;
            var ratio = 0.49 * (1 - Math.exp(-elapsed / 1600));
            renderProgress(ratio);
            preInitFrame = requestAnimationFrame(updatePreInitProgress);
        }
    }

    function completePreInit()
    {
        if (!preInitActive) return;
        preInitActive = false;
        cancelAnimationFrame(preInitFrame);
        renderProgress(0.5);
    }

    function setInitialProgress(ratio)
    {
        completePreInit();
        if (ratio < 0) ratio = 0;
        if (ratio > 1) ratio = 1;
        renderProgress(0.5 + (ratio * 0.5), ratio);
    }

    function setProgress(ratio)
    {
        renderProgress(ratio);
    }

    show();
    this.show = show;
    this.hide = hide;
    this.setTotal = setTotal;
    this.setProgress = setProgress;
    this.completePreInit = completePreInit;
    this.setInitialProgress = setInitialProgress;
}

window.loadingBar = new LoadingBar();
</script>
